# Task 4 — CI/CD & Multi-Environment Deployment

name: CI/CD

on:
  push:
    branches:
      - main
      - "pre-release/v*"
      - "release/v*"
  # Manual trigger for rollback only.
  workflow_dispatch:
    inputs:
      rollback_namespace:
        description: "Namespace to roll back (leave empty to skip)"
        required: false

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: souravdasdocker/node-react-postgres-platform-backend
  FRONTEND_IMAGE: souravdasdocker/node-react-postgres-platform-frontend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Install, validate, and test both services.
  # ─────────────────────────────────────────────────────────────────────────
  build-and-test:
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Syntax-check every source file without running the server.
      - name: Backend syntax validation
        working-directory: backend
        run: node --check src/index.js src/db.js src/queue.js src/redisClient.js src/search.js src/worker.js

      # Run tests if a test/ directory exists (exits 0 either way).
      - name: Backend tests
        working-directory: backend
        run: npm test --if-present

      # Vite build validates the React app compiles cleanly.
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build Docker images and push to Docker Hub.
  # ─────────────────────────────────────────────────────────────────────────
build-and-push:
    needs: build-and-test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract branch and SHA for tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${{ github.ref_name }}-${SHORT_SHA}" >> $GITHUB_ENV
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ env.tag }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ env.tag }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy manifests to the correct Kubernetes namespace.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: self-hosted
    environment: ${{ needs.build-and-push.outputs.namespace }}
    steps:
      - uses: actions/checkout@v4


      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy to ${{ needs.build-and-push.outputs.namespace }}
        env:
          NAMESPACE: ${{ needs.build-and-push.outputs.namespace }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/manifests
          cp k8s/*.yaml /tmp/manifests/

          # Swap image tags in deployment manifests to the freshly built image.
          sed -i "s|souravdasdocker/node-react-postgres-platform-backend:.*|${BACKEND_IMAGE}:${TAG}|g" \
            /tmp/manifests/backend-deployment.yaml \
            /tmp/manifests/bullmq-worker-deployment.yaml

          sed -i "s|souravdasdocker/node-react-postgres-platform-frontend:.*|${FRONTEND_IMAGE}:${TAG}|g" \
            /tmp/manifests/frontend-deployment.yaml

          # Re-target every manifest at the correct namespace.
          sed -i "s/namespace: dev/namespace: ${NAMESPACE}/g" /tmp/manifests/*.yaml

          # Create namespace if it doesn't exist (idempotent).
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -n "${NAMESPACE}" -f /tmp/manifests/

          # Wait for rollout to succeed (or fail fast).
          kubectl rollout status -n "${NAMESPACE}" deployment/backend  --timeout=120s
          kubectl rollout status -n "${NAMESPACE}" deployment/frontend --timeout=120s

  # ─────────────────────────────────────────────────────────────────────────
  # Rollback job — triggered manually via workflow_dispatch.
  # Fast path: kubectl rollout undo (reverts to the previous ReplicaSet).
  # Precise path: re-run this workflow from the previous commit SHA.
  # ─────────────────────────────────────────────────────────────────────────
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_namespace != ''
    runs-on: self-hosted
    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Roll back ${{ inputs.rollback_namespace }}
        env:
          NAMESPACE: ${{ inputs.rollback_namespace }}
        run: |
          kubectl rollout undo -n "${NAMESPACE}" deployment/backend
          kubectl rollout undo -n "${NAMESPACE}" deployment/frontend
          echo "Rolled back backend and frontend in namespace: ${NAMESPACE}"
