# Task 3 — Ingress (API Gateway)
#
# Acts as the single entry point for all external traffic.
# Install the controller first:
#   kind:     kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
#   minikube: minikube addons enable ingress
#
# Then add to /etc/hosts:
#   127.0.0.1  node-react.local
#
# Request flow:
#   Browser → Ingress (nginx) → Service (ClusterIP) → Pod → PostgreSQL
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: dev
  annotations:
    # nginx-ingress controller class
    kubernetes.io/ingress.class: "nginx"

    # ── Rate limiting (Task 6) ─────────────────────────────────────────────
    # Allow 20 requests/second per IP. Burst of 50 before returning 429.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"

    # ── Proxy settings ─────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"

    # Strip /api prefix before forwarding to backend
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - host: node-react.local
      http:
        paths:
          # /api and /api/* → backend-service (port 80 → pod 4000)
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 80

          # / and everything else → frontend-service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
