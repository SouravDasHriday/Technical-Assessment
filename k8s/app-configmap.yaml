# ConfigMap holds non-secret configuration that pods read as environment variables.
# Secret-bearing values (DB passwords, etc.) live in app-secrets.yaml instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dev
data:
  PORT: "4000"
  DB_HOST: postgres-service
  DB_PORT: "5432"
  DB_NAME: appdb
  DB_USER: appuser
  # Simulated read/write cluster — both point at the single local instance.
  # Swap DB_READ_URL to a replica DSN with zero code changes when ready.
  DB_WRITE_URL: postgres://appuser:$(DB_PASSWORD)@postgres-service:5432/appdb
  DB_READ_URL:  postgres://appuser:$(DB_PASSWORD)@postgres-service:5432/appdb
  REDIS_URL: redis://redis-service:6379
  SEARCH_URL: http://search-service:9200
