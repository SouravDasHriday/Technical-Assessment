# Secrets hold sensitive values encoded in base64.
# echo -n 'appuser' | base64  → YXBwdXNlcg==
# echo -n 'apppass'  | base64  → YXBwcGFzcw==
#
# In a real cluster these would be managed by Vault / Sealed Secrets / SOPS,
# NOT committed to the repo. This file is here purely for the local assessment.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: dev
type: Opaque
data:
  # appuser
  DB_USER: YXBwdXNlcg==
  # apppass
  DB_PASSWORD: YXBwcGFzcw==
  # postgres://appuser:apppass@postgres-service:5432/appdb
  DB_WRITE_URL: cG9zdGdyZXM6Ly9hcHB1c2VyOmFwcHBhc3NAcG9zdGdyZXMtc2VydmljZTo1NDMyL2FwcGRi
  DB_READ_URL:  cG9zdGdyZXM6Ly9hcHB1c2VyOmFwcHBhc3NAcG9zdGdyZXMtc2VydmljZTo1NDMyL2FwcGRi
