# Task 6 — HorizontalPodAutoscaler for the backend
#
# Scales backend replicas between 2 and 10 based on CPU utilisation.
# When average CPU across all backend pods exceeds 60%, a new replica is added.
# Requires metrics-server to be installed:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Primary trigger: scale up when avg CPU > 60 %
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    # Secondary trigger: scale up when avg memory > 70 %
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
